name: CI

on:
  pull_request:
    branches: [main]

# Chỉ cấp quyền đọc mã nguồn cho workflow
permissions:
  contents: read

# Commit mới trên cùng PR sẽ hủy lần chạy cũ
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Kiểm tra format
        run: npm run format:check

      - name: Lint, typecheck, test
        run: npm run check
